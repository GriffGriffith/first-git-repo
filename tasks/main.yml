#this file and commit will provide the tasks that ansible will run against the hosts or inventory file given
#in either the apply.yml file or using the -i option for the ansible-playbook command
---

- name: Stop a service on a linux (RHEL) system
  ansible.builtin.systemd:
    name: sssd
    state: stopped
  when: stop_services

- name: Stop more than one service
  systemd: #you can short-hand ansible.builtin plugins with just the last part of the command here
    name: "{{ item }}"
    state: stopped
  loop:
    - mysql
    - firewalld
  ignore_errors: yes #ansible plays will stop at any major error. Generally that's good, but sometimes you can move on; especially if a service isn't enabled or installed and that's ok by you
  when: stop_services

- name: Start the services
  systemd:
    name: "{{ item }}"
    state: started
  loop:
    - sssd
    - mysql
    - firewalld
  ignore_errors: yes
  when: start_services